# ============================================================
# Email Address Generator — Config
# ============================================================
# Hier wird alles eingestellt — kein Python nötig!
# ============================================================

# ------------------------------------------------------------
# OUTPUT
# ------------------------------------------------------------
output:
  total_count: 200         # Gesamtanzahl Emails
  spam_ratio: 0.10           # 10% Spam = 100 Spam, 900 Normal
  output_file: "examples/sample_200_real_domain.csv"
  seed: 42                   # Reproduzierbarkeit

# ------------------------------------------------------------
# DOMAINS — RFC 2606 reserviert (nie erreichbar, nie echt!)
# ------------------------------------------------------------

domains:
  normal:
    - "gmail.com"
    - "gmx.de"
    - "web.de"
    - "t-online.de"
    - "outlook.com"
    - "yahoo.com"
    - "icloud.com"
    - "protonmail.com"
    - "hotmail.com"
    - "freenet.de"
    - "posteo.de"
    - "mailbox.org"
    - "yahoo.de"
    - "googlemail.com"


  spam_tlds:
    - ".biz"
    - ".xyz"
    - ".click"
    - ".top"
    - ".win"
    - ".loan"
    - ".work"
    - ".info"
    - ".online"
    - ".site"

