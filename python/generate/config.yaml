# ------------------------------------------------------------
# SPAM PATTERNS
# ------------------------------------------------------------
spam:
  patterns:
    - random_chars        # xk7f2q9p
    - digits_heavy        # user123456789
    - mixed_chaos         # xK7f2Q9p
    - short_random        # xk7f
    - long_random         # xk7f2q9pmnbvcxz

  local_length:
    min: 5
    max: 16

  domain_length:
    min: 4
    max: 10

# ------------------------------------------------------------
# EMAIL FORMAT OPTIONEN
# ------------------------------------------------------------
format:
  separators:
    - "."                 # vorname.nachname
    - "_"                 # vorname_nachname
    - ""                  # vornamennachname
  
  suffix_probability: 0.15   # 15% bekommen Jahreszahl: martin1985
  suffix_range:
    min: 1970
    max: 2005